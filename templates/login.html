{% extends 'base.html' %}
{% block title %}Login - ShoeKart{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm p-4">
                <h3 class="fw-bold text-center mb-4">Login to ShoeKart</h3>
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-warning w-100">Login</button>
                </form>
                <p class="text-center mt-3 small">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
                <p class="text-center text-muted small">Admin? <a href="{{ url_for('admin_login') }}">Admin Login</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
