{% extends 'admin/_admin_base.html' %}
{% block title %}Edit Product - ShoeKart{% endblock %}
{% block admin_content %}
<h3 class="fw-bold mb-4">Edit Product</h3>
<div class="card shadow-sm p-4">
    <form method="post" enctype="multipart/form-data">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Product Name</label>
                <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Category</label>
                <select name="category_id" class="form-select" required>
                    {% for cat in categories %}
                    <option value="{{ cat.id }}" {% if cat.id == product.category_id %}selected{% endif %}>{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="3">{{ product.description }}</textarea>
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Price (₹)</label>
                <input type="number" step="0.01" name="price" class="form-control" value="{{ product.price }}" required>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Discount Price (₹)</label>
                <input type="number" step="0.01" name="discount_price" class="form-control" value="{{ product.discount_price or '' }}">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Stock Quantity</label>
                <input type="number" name="stock" class="form-control" value="{{ product.stock }}" required>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Sizes &amp; Stock (view only here - use Products list to adjust total stock)</label>
            <div class="d-flex gap-3 flex-wrap">
                {% for s in sizes %}
                <span class="badge bg-light text-dark border">Size {{ s.size }}: {{ s.stock }} pcs</span>
                {% endfor %}
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Replace Image</label>
            <input type="file" name="image" class="form-control" accept="image/*">
            <small class="text-muted">Current: {{ product.image }}</small>
        </div>
        <div class="d-flex gap-3 mb-3">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="is_new" id="is_new" {% if product.is_new %}checked{% endif %}>
                <label class="form-check-label" for="is_new">Mark as NEW</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="is_popular" id="is_popular" {% if product.is_popular %}checked{% endif %}>
                <label class="form-check-label" for="is_popular">Mark as POPULAR</label>
            </div>
        </div>
        <button type="submit" class="btn btn-warning">Update Product</button>
        <a href="{{ url_for('admin_products') }}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
