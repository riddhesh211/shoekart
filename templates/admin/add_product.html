{% extends 'admin/_admin_base.html' %}
{% block title %}Add Product - ShoeKart{% endblock %}
{% block admin_content %}
<h3 class="fw-bold mb-4">Add New Product</h3>
<div class="card shadow-sm p-4">
    <form method="post" enctype="multipart/form-data">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Product Name</label>
                <input type="text" name="name" class="form-control" value="{{ form.get('name','') }}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Category</label>
                <select name="category_id" class="form-select" required>
                    <option value="">Select category</option>
                    {% for cat in categories %}
                    <option value="{{ cat.id }}">{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="3">{{ form.get('description','') }}</textarea>
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Price (₹)</label>
                <input type="number" step="0.01" name="price" class="form-control" required>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Discount Price (₹) - optional</label>
                <input type="number" step="0.01" name="discount_price" class="form-control">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Stock Quantity</label>
                <input type="number" name="stock" class="form-control" value="10" required>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Available Sizes</label>
            <div class="d-flex gap-3">
                {% for s in ['6','7','8','9','10'] %}
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="sizes" value="{{ s }}" id="s{{ s }}" checked>
                    <label class="form-check-label" for="s{{ s }}">{{ s }}</label>
                </div>
                {% endfor %}
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Product Image</label>
            <input type="file" name="image" class="form-control" accept="image/*">
        </div>
        <div class="d-flex gap-3 mb-3">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="is_new" id="is_new">
                <label class="form-check-label" for="is_new">Mark as NEW</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="is_popular" id="is_popular">
                <label class="form-check-label" for="is_popular">Mark as POPULAR</label>
            </div>
        </div>
        <button type="submit" class="btn btn-warning">Save Product</button>
        <a href="{{ url_for('admin_products') }}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
