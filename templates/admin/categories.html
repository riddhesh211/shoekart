{% extends 'admin/_admin_base.html' %}
{% block title %}Manage Categories - ShoeKart{% endblock %}
{% block admin_content %}
<h3 class="fw-bold mb-4">Manage Categories</h3>

<div class="card shadow-sm p-3 mb-4">
    <form method="post" class="d-flex gap-2">
        <input type="text" name="name" class="form-control" placeholder="New category name" required>
        <button class="btn btn-warning">Add Category</button>
    </form>
</div>

<div class="card shadow-sm p-3">
    <table class="table table-hover">
        <thead><tr><th>Name</th><th>Slug</th><th>Actions</th></tr></thead>
        <tbody>
        {% for cat in categories %}
        <tr>
            <td>{{ cat.name }}</td>
            <td>{{ cat.slug }}</td>
            <td><a href="{{ url_for('admin_delete_category', category_id=cat.id) }}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this category? All its products will also be removed.')"><i class="fa-solid fa-trash"></i> Delete</a></td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
