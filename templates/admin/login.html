{% extends 'base.html' %}
{% block title %}Admin Login - ShoeKart{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm p-4">
                <h3 class="fw-bold text-center mb-4"><i class="fa-solid fa-user-shield"></i> Admin Login</h3>
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-dark w-100">Login as Admin</button>
                </form>
                <p class="text-center text-muted small mt-3">Default: admin@shoekart.com / admin123</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
